spring.application.name=carsync-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/carsync_crm}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

carsync.jwt.secret=${CARSYNC_JWT_SECRET:change-this-secret-key-for-production-change-this-secret-key}
carsync.jwt.expiration-days=${CARSYNC_JWT_EXPIRATION_DAYS:30}
carsync.cors.allowed-origins=${CARSYNC_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:*,http://127.0.0.1:*}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
